<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAK Inventory Management Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #333;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background-color: #F48610;
            color: white;
            padding-top: 10px;
        }

        .logo-container {
            text-align: center;
            padding: 15px 0;
        }

        .logo {
            width: 80px;
            height: 80px;
            background-color: white;
            border-radius: 5px;
            object-fit: contain;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .nav-item:hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .nav-item.active {
            background-color: #1C1106;
        }

        .nav-item i {
            margin-right: 10px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: white;
            border-bottom: 1px solid #ddd;
        }

        .breadcrumb {
            color: #777;
        }

        .search-container {
            flex: 1;
            max-width: 450px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #ddd;
            padding-left: 35px;
        }

        .search-icon {
            position: absolute;
            margin-top: 8px;
            margin-left: 10px;
            color: #777;
        }

        .user-actions {
            display: flex;
            gap: 15px;
        }

        .user-actions i {
            font-size: 20px;
            color: #777;
            cursor: pointer;
        }

        /* Orange bar */
        .orange-bar {
            height: 40px;
            background-color: #f08c00;
        }

        /* Dashboard Content */
        .dashboard-content {
            flex: 1;
            background-color: #f5f5f5;
            padding: 20px;
            overflow-y: auto;
        }

        .dashboard-header {
            margin-bottom: 20px;
            color: #ff5252;
            text-transform: uppercase;
            font-size: 14px;
            font-weight: bold;
        }

        .user-profile {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .profile-name {
            font-weight: 500;
            color: #333;
        }

        .add-icon {
            margin-left: 10px;
            color: #777;
            cursor: pointer;
        }

        /* Sales Chart */
        .sales-chart-container {
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sales-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .sales-title {
            font-size: 14px;
            font-weight: bold;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .date-picker {
            display: flex;
            align-items: center;
        }

        .date-input {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
        }

        .chart-container {
            position: relative;
            height: 180px;
            padding-bottom: 30px;
            margin-top: 20px;
        }

        .chart {
            position: relative;
            height: 100%;
            width: 100%;
            border-bottom: 1px solid #ddd;
        }

        .price-labels {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #777;
            font-size: 12px;
        }

        .price-label {
            transform: translateY(-50%);
        }

        .chart-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .grid-line {
            height: 1px;
            background-color: rgba(0,0,0,0.05);
            width: 100%;
        }

        .vertical-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: rgba(0,0,0,0.05);
        }

        .chart-line {
            position: absolute;
            top: 0;
            left: 40px;
            right: 0;
            bottom: 0;
            z-index: 2;
        }

        .line-one {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: #000;
            stroke-width: 2px;
            fill: none;
        }

        .line-two {
            position: absolute;
            width: 100%;
            height: 100%;
            stroke: #f08c00;
            stroke-width: 2px;
            fill: none;
        }

        .chart-area {
            position: absolute;
            left: 40px;
            right: 0;
            bottom: 0;
            height: 100%;
            z-index: 1;
        }
        
        .area-fill {
            position: absolute;
            width: 100%;
            height: 100%;
            fill: rgba(240, 140, 0, 0.2);
        }

        .total-amount {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 24px;
            font-weight: bold;
        }

        .chart-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            color: #777;
            font-size: 12px;
            padding-left: 40px;
        }

        /* Bottom Cards */
        .bottom-cards {
            display: flex;
            gap: 20px;
        }

        .card {
            flex: 1;
            background-color: white;
            border-radius: 5px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .stocks-card {
            background-color: #181818;
            color: white;
        }

        .stocks-title {
            margin-bottom: 15px;
            font-size: 14px;
        }

        .stocks-amount {
            font-size: 36px;
            font-weight: bold;
            color: #f08c00;
            margin-bottom: 5px;
        }

        .stocks-percentage {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .progress-container {
            position: relative;
        }

        .progress-bg {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background-color: #333;
            margin: 0 auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-fill {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            background: conic-gradient(#f08c00 0% 80%, transparent 80% 100%);
            position: absolute;
            top: 0;
            left: 0;
        }

        .progress-center {
            height: 70px;
            width: 70px;
            border-radius: 50%;
            background-color: #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .progress-percentage {
            font-size: 24px;
            font-weight: bold;
        }

        /* Products Card */
        .products-card {
            flex: 2;
        }

        .products-header {
            margin-bottom: 20px;
            font-weight: bold;
        }

        .products-table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th {
            text-align: left;
            padding: 10px;
            color: #777;
            font-weight: normal;
            font-size: 12px;
        }

        .products-table td {
            padding: 10px;
            border-top: 1px solid #f0f0f0;
        }

        .product-name {
            font-weight: 500;
        }

        .product-info {
            font-size: 12px;
            color: #777;
        }

        .popularity-bar {
            height: 5px;
            background-color: #f0f0f0;
            border-radius: 5px;
            position: relative;
            width: 100%;
        }

        .popularity-fill {
            position: absolute;
            height: 5px;
            background-color: #f08c00;
            border-radius: 5px;
        }

        .sales-percentage {
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
